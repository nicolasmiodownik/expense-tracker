<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<meta name="description" content="Registro de gastos personal, mobile first, con panorama mensual e insights automáticos. Demo con datos de ejemplo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-alt:#f1f1ee;
  --ink:#0b0b0b; --ink-soft:#52514e; --muted:#898781;
  --border:rgba(11,11,11,0.10); --grid:#e1e0d9;
  --brand:#1d6f64; --brand-soft:#e3efec; --brand-contrast:#ffffff; --accent-2:#c9862c;
  --good:#0ca30c; --warning:#c98500; --serious:#c65a2e; --critical:#d03b3b;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#c98500; --cat-5:#c94c78; --cat-6:#087a08; --cat-7:#4a3aa7; --cat-8:#c43f3e; --cat-other:#a9a79f;
  --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-display:'Fraunces',ui-serif,Georgia,serif;
  --font-body:'Work Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#171c1a; --surface-alt:#1f2523;
    --ink:#f4f4f2; --ink-soft:#c3c2b7; --muted:#8f8d86;
    --border:rgba(255,255,255,0.12); --grid:#2c332f;
    --brand:#59bfad; --brand-soft:#13312c; --brand-contrast:#06120f; --accent-2:#e0a94a;
    --good:#3fc23f; --warning:#e0a83a; --serious:#e0835a; --critical:#e2665f;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#26b884; --cat-4:#d99b2e; --cat-5:#d97197; --cat-6:#3fa23f; --cat-7:#9085e9; --cat-8:#e07675; --cat-other:#5b5a55;
  }
}
html,body{height:100%;}
body{margin:0; background:var(--page); color:var(--ink); font-family:var(--font-body); display:flex; justify-content:center; min-height:100dvh;}
#root{width:100%; max-width:480px; min-height:100dvh; background:var(--surface); display:flex; flex-direction:column; position:relative; box-shadow:0 0 0 1px var(--border);}
@media (min-width:560px){
  body{padding:28px 12px;}
  #root{min-height:min(860px,calc(100dvh - 56px)); border-radius:var(--radius-l); overflow:hidden; box-shadow:0 1px 2px var(--border),0 18px 40px -20px rgba(0,0,0,0.35);}
}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 10px; flex:0 0 auto;}
.app-mark{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:500; font-size:1rem;}
.app-mark svg{display:block;}
.demo-pill{font-family:var(--font-mono); font-size:0.68rem; color:var(--ink-soft); background:var(--surface-alt); padding:4px 10px; border-radius:999px;}
.view{flex:1 1 auto; overflow-y:auto; padding:4px 20px 24px; -webkit-overflow-scrolling:touch;}
.view::-webkit-scrollbar{width:0;}
h2.section-title{font-family:var(--font-display); font-weight:500; font-size:1.05rem; margin:22px 0 12px; color:var(--ink);}
h2.section-title:first-child{margin-top:6px;}
.segmented{display:flex; background:var(--surface-alt); border-radius:999px; padding:4px; gap:4px; margin-bottom:20px;}
.segmented button{flex:1; border:none; background:transparent; padding:9px 12px; border-radius:999px; font-family:var(--font-body); font-weight:600; font-size:0.86rem; color:var(--ink-soft); cursor:pointer;}
.segmented button.selected{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px var(--border);}
.field{margin-bottom:20px;}
.field label{display:block; font-size:0.82rem; font-weight:600; color:var(--ink-soft); margin-bottom:8px;}
.amount-wrap{display:flex; align-items:baseline; gap:6px; border-bottom:2px solid var(--border); padding-bottom:10px;}
.amount-wrap span{font-family:var(--font-mono); font-size:1.5rem; color:var(--muted);}
.amount-wrap input{border:none; background:transparent; outline:none; font-family:var(--font-mono); font-size:2.5rem; font-weight:500; color:var(--ink); width:100%; padding:0; font-variant-numeric:tabular-nums;}
.amount-wrap input::placeholder{color:var(--muted);}
.amount-wrap.field-error{border-bottom-color:var(--critical);}
input[type=text].line-input,input[type=text].desc-input{width:100%; border:none; border-bottom:2px solid var(--border); background:transparent; outline:none; font-family:var(--font-body); font-size:1rem; color:var(--ink); padding:8px 0;}
input.line-input::placeholder,input.desc-input::placeholder{color:var(--muted);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{border:1.5px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:8px 14px; font-family:var(--font-body); font-size:0.86rem; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:7px;}
.chip .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.chip.selected{background:var(--brand-soft); border-color:var(--brand); color:var(--ink); font-weight:600;}
.section-error{outline:2px solid var(--critical); outline-offset:4px; border-radius:var(--radius-m);}
.btn-primary{width:100%; border:none; background:var(--brand); color:var(--brand-contrast); font-family:var(--font-body); font-weight:700; font-size:0.98rem; padding:15px; border-radius:var(--radius-m); cursor:pointer; margin-top:8px;}
.btn-primary:active{opacity:0.85;}
.photo-drop{border:1.5px dashed var(--border); border-radius:var(--radius-m); padding:32px 16px; text-align:center; cursor:pointer; background:var(--surface-alt);}
.photo-drop .icon{font-family:var(--font-display); font-style:italic; font-size:2rem; color:var(--brand); display:block; margin-bottom:6px;}
.photo-drop p{margin:0; color:var(--ink-soft); font-size:0.9rem;}
.photo-preview{margin-top:14px; border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--border);}
.photo-preview img{display:block; width:100%; max-height:260px; object-fit:cover;}
.pending-note{font-size:0.8rem; color:var(--muted); margin-top:10px; line-height:1.5;}
.pending-badge{display:inline-block; margin-top:10px; font-family:var(--font-mono); font-size:0.72rem; background:var(--surface-alt); color:var(--ink-soft); padding:5px 10px; border-radius:999px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.stat-tile{background:var(--surface-alt); border-radius:var(--radius-m); padding:14px 16px;}
.stat-tile.wide{grid-column:span 2; position:relative; overflow:hidden;}
.stat-tile.wide::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg, var(--brand), var(--accent-2));}
.stat-tile .label{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 6px;}
.stat-tile .value{font-family:var(--font-mono); font-size:1.5rem; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; margin:0;}
.stat-tile .delta{font-family:var(--font-mono); font-size:0.78rem; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:999px;}
.delta.up{background:rgba(208,59,59,0.12); color:var(--critical);}
.delta.down{background:rgba(12,163,12,0.12); color:var(--good);}
.bar-row{margin-bottom:14px;}
.bar-row .bar-head{display:flex; justify-content:space-between; font-size:0.86rem; margin-bottom:6px;}
.bar-row .bar-head .name{color:var(--ink); font-weight:500;}
.bar-row .bar-head .amt{font-family:var(--font-mono); color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.bar-track{height:8px; background:var(--surface-alt); border-radius:999px; overflow:hidden;}
.bar-fill{height:100%; border-radius:999px;}
.trend-chart{display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:10px;}
.trend-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px;}
.trend-bar-wrap{width:100%; flex:1; display:flex; align-items:flex-end;}
.trend-bar{width:100%; border-radius:5px 5px 2px 2px; background:var(--grid); min-height:3px;}
.trend-bar.current{background:var(--brand);}
.trend-col .m-label{font-size:0.68rem; font-family:var(--font-mono); color:var(--muted); text-transform:lowercase;}
.insight-card{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:var(--radius-m); background:var(--surface-alt); margin-bottom:10px; border-left:3px solid var(--muted);}
.insight-card.good{border-left-color:var(--good);}
.insight-card.warning{border-left-color:var(--warning);}
.insight-card.info{border-left-color:var(--brand);}
.insight-card .tag{font-family:var(--font-mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); display:block; margin-bottom:2px;}
.insight-card p{margin:0; font-size:0.88rem; color:var(--ink); line-height:1.4;}
.empty-state{text-align:center; padding:52px 20px; color:var(--ink-soft);}
.empty-state .icon-mark{display:flex; justify-content:center; margin-bottom:14px;}
.empty-state p{margin:0 0 18px; font-size:0.94rem; line-height:1.5;}
.empty-state .btn-primary{width:auto; padding:12px 22px;}
.banner{background:var(--brand-soft); color:var(--ink); border-radius:var(--radius-m); padding:12px 14px; font-size:0.84rem; margin-bottom:18px; line-height:1.45;}
.toast{position:absolute; left:20px; right:20px; bottom:76px; background:var(--ink); color:var(--surface); padding:12px 14px; border-radius:var(--radius-m); font-size:0.86rem; text-align:center;}
.undo-link{display:block; width:100%; text-align:center; margin-top:6px; background:none; border:none; color:var(--muted); font-family:var(--font-body); font-size:0.8rem; text-decoration:underline; cursor:pointer; padding:10px;}
.navbar{flex:0 0 auto; display:flex; border-top:1px solid var(--border); background:var(--surface); padding-bottom:env(safe-area-inset-bottom);}
.navtab{flex:1; border:none; background:none; padding:12px 0 10px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-family:var(--font-body); font-size:0.72rem; font-weight:600; cursor:pointer;}
.navtab .mark{width:20px; height:2px; border-radius:2px; background:transparent;}
.navtab.active{color:var(--ink);}
.navtab.active .mark{background:var(--brand);}
input:focus-visible,button:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Expense Tracker (demo). Todos los datos de esta versión son de ejemplo y se guardan solo en tu navegador.

var CATEGORIES = [
  {key:'comida', label:'Comida', subs:['Supermercado','Delivery','Restaurantes/Bares','Café']},
  {key:'transporte', label:'Transporte', subs:['Nafta','Estacionamiento/Peajes','Apps (Uber/Cabify)','Transporte público']},
  {key:'hogar', label:'Hogar', subs:['Alquiler/Expensas','Servicios (luz/gas/internet)','Mantenimiento','Limpieza']},
  {key:'salud', label:'Salud', subs:['Farmacia','Consultas','Prepaga']},
  {key:'salidas', label:'Salidas/Entretenimiento', subs:['Streaming','Eventos/Shows','Salidas nocturnas']},
  {key:'compras', label:'Compras', subs:['Ropa','Tecnología','Regalos']},
  {key:'deportes', label:'Deportes/Hobbies', subs:['Gimnasio','Clases','Equipamiento']},
  {key:'viajes', label:'Viajes', subs:['Pasajes','Hospedaje','Gastos en destino']},
  {key:'servicios', label:'Servicios/Suscripciones', subs:['Apps','Software']},
  {key:'finanzas', label:'Finanzas', subs:['Comisiones','Impuestos','Ahorro/Inversión']},
  {key:'otros', label:'Otros', subs:[]}
];
var CAT_SLOT = {comida:1, transporte:2, hogar:3, salud:4, salidas:5, compras:6, deportes:7, viajes:8};
var PAYMENT_METHODS = ['Efectivo','Débito','Crédito','Transferencia','Billetera virtual'];
var PAY_SLOT = {'Efectivo':1,'Débito':2,'Crédito':3,'Transferencia':4,'Billetera virtual':5};
var STORAGE_KEY = 'expense-tracker-demo-v1';
var FIXED = ['Alquiler/Expensas','Servicios (luz/gas/internet)','Prepaga','Gimnasio','Streaming','Apps','Software'];

// ---------- Datos de ejemplo (ficticios, generados en el navegador) ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function buildSampleData(){
  var rnd = mulberry32(42);
  var now = new Date();
  var entries = [];
  function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
  function amt(min,max){ return Math.round((min + rnd()*(max-min))/100)*100; }
  function add(date, amount, pay, cat, desc){
    if(date > now) return;
    entries.push({id:'s'+entries.length, ts:date.toISOString(), amount:amount, paymentMethod:pay, category:cat, description:desc, source:'sample'});
  }
  for(var m=5; m>=0; m--){
    var first = new Date(now.getFullYear(), now.getMonth()-m, 1);
    var days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
    var lift = 1 + (5-m)*0.03; // leve inflación mes a mes
    function day(d,h){ return new Date(first.getFullYear(), first.getMonth(), Math.min(d,days), h||12, Math.floor(rnd()*59)); }
    // Fijos del mes
    add(day(5,10), Math.round(820000*lift/1000)*1000, 'Transferencia', 'hogar', 'Alquiler/Expensas');
    add(day(8,11), amt(95000,130000)*lift|0, 'Billetera virtual', 'hogar', 'Servicios (luz/gas/internet)');
    add(day(10,9), Math.round(78000*lift/100)*100, 'Débito', 'salud', 'Prepaga');
    add(day(3,9), Math.round(42000*lift/100)*100, 'Débito', 'deportes', 'Gimnasio');
    add(day(12,20), 14500, 'Crédito', 'salidas', 'Streaming');
    add(day(15,20), 9900, 'Crédito', 'servicios', 'Apps');
    // Variables
    for(var d=1; d<=days; d++){
      if(d % 7 === 2) add(day(d,18), amt(38000,72000)*lift|0, pick(['Débito','Crédito']), 'comida', 'Supermercado');
      if(rnd() < 0.28) add(day(d,21), amt(16000,38000)*lift|0, pick(['Crédito','Billetera virtual']), 'comida', 'Delivery');
      if(rnd() < 0.18) add(day(d,22), amt(18000,55000)*lift|0, pick(['Crédito','Débito','Efectivo']), 'comida', 'Restaurantes/Bares');
      if(rnd() < 0.30) add(day(d,9), amt(3500,6500), pick(['Billetera virtual','Débito']), 'comida', 'Café');
      if(d % 9 === 4) add(day(d,8), amt(55000,80000)*lift|0, 'Billetera virtual', 'transporte', 'Nafta');
      if(rnd() < 0.16) add(day(d,19), amt(4500,12000), 'Billetera virtual', 'transporte', 'Apps (Uber/Cabify)');
      if(rnd() < 0.05) add(day(d,17), amt(25000,120000), 'Crédito', 'compras', pick(['Ropa','Regalos','Tecnología']));
      if(rnd() < 0.05) add(day(d,23), amt(20000,60000), pick(['Efectivo','Crédito']), 'salidas', pick(['Salidas nocturnas','Eventos/Shows']));
      if(rnd() < 0.04) add(day(d,14), amt(6000,25000), 'Débito', 'salud', 'Farmacia');
    }
    if(m === 2){ add(day(18,15), 380000, 'Crédito', 'viajes', 'Pasajes'); add(day(22,15), 210000, 'Crédito', 'viajes', 'Hospedaje'); }
  }
  entries.sort(function(a,b){ return a.ts < b.ts ? -1 : 1; });
  return {entries:entries, pendingPhotos:[]};
}

// ---------- Persistencia local (solo este navegador) ----------
function loadState(){
  try{ var raw = localStorage.getItem(STORAGE_KEY); if(raw){ var s = JSON.parse(raw); if(s && s.entries) return s; } }catch(e){}
  return buildSampleData();
}
function saveState(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }

(function appMain(){
  var state = loadState();
  var ui = { view:'panorama', formMode:'manual', payment:null, category:null, description:'', descMode:'chip', amount:'', photoPreview:null, photoNote:'', errors:{}, toast:'' };

  function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var escapeHtml = escapeAttr;
  function formatMoney(n){ try{ return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0); }catch(e){ return '$'+Math.round(n||0); } }
  function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function categoryLabel(key){ var c=CATEGORIES.filter(function(c){return c.key===key;})[0]; return c?c.label:key; }
  function catColor(key){ var slot=CAT_SLOT[key]; return slot? 'var(--cat-'+slot+')' : 'var(--cat-other)'; }
  function payColor(name){ var slot=PAY_SLOT[name]; return slot? 'var(--cat-'+slot+')' : 'var(--cat-other)'; }
  function markSvg(px){
    return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 32 32" fill="none" aria-hidden="true">'
      + '<path d="M16 2.5 L27.5 16 L16 29.5 L4.5 16 Z" fill="var(--brand)"/>'
      + '<circle cx="16" cy="16" r="4.2" fill="var(--accent-2)"/></svg>';
  }

  function computeDashboard(){
    var now = new Date();
    var curKey = ym(now);
    var prevKey = ym(new Date(now.getFullYear(), now.getMonth()-1, 1));
    function sum(arr){ return arr.reduce(function(s,e){return s+e.amount;},0); }
    var curEntries = state.entries.filter(function(e){ return ym(new Date(e.ts))===curKey; });
    var dayOfMonth = now.getDate();
    // Comparación justa: mes actual vs. el mes anterior hasta el mismo día
    var prevSameDays = state.entries.filter(function(e){ var d=new Date(e.ts); return ym(d)===prevKey && d.getDate()<=dayOfMonth; });
    var curTotal = sum(curEntries);
    var prevTotal = sum(prevSameDays);
    var pctChange = prevTotal>0 ? ((curTotal-prevTotal)/prevTotal*100) : null;
    var daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    var avgDaily = dayOfMonth>0 ? curTotal/dayOfMonth : 0;
    // Proyección: los gastos fijos (alquiler, servicios, cuotas) se suman una vez; solo lo variable se extrapola
    var fixedTotal = sum(curEntries.filter(function(e){ return FIXED.indexOf(e.description)>=0; }));
    var projected = fixedTotal + (dayOfMonth>0 ? (curTotal-fixedTotal)/dayOfMonth*daysInMonth : 0);

    function totalsBy(field){
      var t = {};
      curEntries.forEach(function(e){ t[e[field]] = (t[e[field]]||0) + e.amount; });
      return Object.keys(t).map(function(k){return [k, t[k]];}).sort(function(a,b){return b[1]-a[1];});
    }
    var trend = [];
    for(var i=5;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var key = ym(d);
      trend.push({ label:d.toLocaleDateString('es-AR',{month:'short'}).replace('.',''), total:sum(state.entries.filter(function(e){ return ym(new Date(e.ts))===key; })), isCurrent:key===curKey });
    }
    return {curTotal:curTotal, pctChange:pctChange, projected:projected, avgDaily:avgDaily, catEntries:totalsBy('category'), payEntries:totalsBy('paymentMethod'), trend:trend, curEntries:curEntries, dayOfMonth:dayOfMonth};
  }

  function buildInsights(dash){
    var out = [];
    if(dash.curEntries.length===0) return out;
    if(dash.pctChange!==null){
      if(dash.pctChange>=15) out.push({level:'warning', tag:'Atención', text:'Vas '+Math.round(dash.pctChange)+'% arriba del mes pasado a esta misma altura.'});
      else if(dash.pctChange<=-10) out.push({level:'good', tag:'Mejora', text:'Vas '+Math.round(Math.abs(dash.pctChange))+'% abajo del mes pasado a esta misma altura.'});
    }
    if(dash.catEntries.length){
      var share = dash.curTotal>0 ? dash.catEntries[0][1]/dash.curTotal*100 : 0;
      if(share>=35) out.push({level:'info', tag:'Dato', text:Math.round(share)+'% del gasto del mes está en '+categoryLabel(dash.catEntries[0][0])+'.'});
    }
    var delivery = dash.curEntries.filter(function(e){return e.description==='Delivery';});
    if(delivery.length>=4){
      var dTot = delivery.reduce(function(s,e){return s+e.amount;},0);
      out.push({level:'info', tag:'Dato', text:delivery.length+' deliveries este mes por '+formatMoney(dTot)+'.'});
    }
    if(dash.payEntries.length){
      var shareP = dash.curTotal>0 ? dash.payEntries[0][1]/dash.curTotal*100 : 0;
      if(shareP>=55) out.push({level:'info', tag:'Dato', text:Math.round(shareP)+'% de los gastos son con '+dash.payEntries[0][0]+'.'});
    }
    if(dash.dayOfMonth>=5 && dash.projected>0) out.push({level:'info', tag:'Proyección', text:'A este ritmo, cerrarías el mes en '+formatMoney(dash.projected)+'.'});
    return out;
  }

  function persist(newState, toast){
    state = newState; saveState(state);
    ui.toast = toast || '';
    renderRoot();
    if(ui.toast){ setTimeout(function(){ ui.toast=''; renderRoot(); }, 2200); }
  }

  function syncUiFromDom(){
    var a=document.getElementById('f-amount'); if(a) ui.amount=a.value;
    var d=document.getElementById('f-desc'); if(d && ui.descMode==='custom') ui.description=d.value;
    var n=document.getElementById('f-photo-note'); if(n) ui.photoNote=n.value;
  }

  function fileToCompressedDataUri(file){
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var maxDim=900, w=img.width, h=img.height;
          if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
          var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',0.55));
        };
        img.onerror=reject; img.src=reader.result;
      };
      reader.onerror=reject; reader.readAsDataURL(file);
    });
  }

  function resetForm(){ ui.payment=null; ui.category=null; ui.description=''; ui.descMode='chip'; ui.amount=''; ui.photoPreview=null; ui.photoNote=''; ui.errors={}; }

  function handleSaveManual(){
    syncUiFromDom();
    var amountNum = parseFloat(String(ui.amount||'').replace(/\./g,'').replace(',','.'));
    ui.errors = {};
    if(!amountNum || amountNum<=0) ui.errors.amount=true;
    if(!ui.payment) ui.errors.payment=true;
    if(!ui.category) ui.errors.category=true;
    if(Object.keys(ui.errors).length){ renderRoot(); return; }
    var entry = { id:'e'+Date.now()+Math.random().toString(36).slice(2,7), ts:new Date().toISOString(), amount:amountNum, paymentMethod:ui.payment, category:ui.category, description:String(ui.description||'').trim(), source:'manual' };
    resetForm();
    persist({entries:state.entries.concat([entry]), pendingPhotos:state.pendingPhotos}, 'Gasto guardado');
  }

  function handleSavePhoto(){
    syncUiFromDom();
    if(!ui.photoPreview) return;
    var photo = { id:'p'+Date.now(), ts:new Date().toISOString(), note:String(ui.photoNote||'').trim() };
    resetForm();
    persist({entries:state.entries, pendingPhotos:state.pendingPhotos.concat([photo])}, 'Foto en cola');
  }

  function handleUndo(){
    var idx = -1;
    for(var i=state.entries.length-1;i>=0;i--){ if(state.entries[i].source==='manual'){ idx=i; break; } }
    if(idx<0){ persist(state, 'No hay gastos cargados por vos para deshacer'); return; }
    var entries = state.entries.slice(); entries.splice(idx,1);
    persist({entries:entries, pendingPhotos:state.pendingPhotos}, 'Último gasto eliminado');
  }

  function handleExport(){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download='gastos-demo.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function handleReset(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} resetForm(); persist(buildSampleData(), 'Demo restablecida'); }

  function renderTopbar(){
    return '<div class="topbar"><span class="app-mark">'+markSvg(22)+'Gastos</span><span class="demo-pill">demo · datos de ejemplo</span></div>';
  }
  function renderNav(){
    return '<div class="navbar">'
      + '<button class="navtab'+(ui.view==='cargar'?' active':'')+'" data-nav="cargar"><span class="mark"></span>Cargar</button>'
      + '<button class="navtab'+(ui.view==='panorama'?' active':'')+'" data-nav="panorama"><span class="mark"></span>Panorama</button>'
      + '</div>';
  }

  function renderCargar(){
    var html = '<div class="view"><div class="segmented">'
      + '<button class="'+(ui.formMode==='manual'?'selected':'')+'" data-mode="manual">Manual</button>'
      + '<button class="'+(ui.formMode==='photo'?'selected':'')+'" data-mode="photo">Foto</button></div>';
    if(ui.formMode==='manual'){
      html += '<div class="field"><label for="f-amount">Monto</label><div class="amount-wrap'+(ui.errors.amount?' field-error':'')+'"><span>$</span><input id="f-amount" type="text" inputmode="decimal" placeholder="0" value="'+escapeAttr(ui.amount)+'"></div></div>';
      html += '<div class="field'+(ui.errors.payment?' section-error':'')+'"><label>Forma de pago</label><div class="chip-row">';
      PAYMENT_METHODS.forEach(function(p){ html += '<button class="chip'+(ui.payment===p?' selected':'')+'" data-pay="'+escapeAttr(p)+'"><span class="dot" style="background:'+payColor(p)+'"></span>'+escapeHtml(p)+'</button>'; });
      html += '</div></div>';
      html += '<div class="field'+(ui.errors.category?' section-error':'')+'"><label>Categoría</label><div class="chip-row">';
      CATEGORIES.forEach(function(c){ html += '<button class="chip'+(ui.category===c.key?' selected':'')+'" data-cat="'+c.key+'"><span class="dot" style="background:'+catColor(c.key)+'"></span>'+escapeHtml(c.label)+'</button>'; });
      html += '</div></div>';
      var selCat = ui.category ? CATEGORIES.filter(function(c){return c.key===ui.category;})[0] : null;
      if(selCat){
        html += '<div class="field"><label>Descripción</label><div class="chip-row">';
        selCat.subs.forEach(function(s){ html += '<button class="chip'+(ui.descMode==='chip' && ui.description===s?' selected':'')+'" data-desc="'+escapeAttr(s)+'">'+escapeHtml(s)+'</button>'; });
        html += '<button class="chip'+(ui.descMode==='custom'?' selected':'')+'" data-desc="__custom__">Otro</button></div>';
        if(ui.descMode==='custom') html += '<div style="margin-top:10px;"><input id="f-desc" class="desc-input" type="text" placeholder="¿Qué fue?" value="'+escapeAttr(ui.description)+'"></div>';
        html += '</div>';
      }
      html += '<button class="btn-primary" data-action="save-manual">Guardar gasto</button>';
    } else {
      if(ui.photoPreview){
        html += '<div class="photo-preview"><img src="'+ui.photoPreview+'" alt="Foto del ticket"></div>';
        html += '<div class="field" style="margin-top:14px;"><label for="f-photo-note">Nota (opcional)</label><input id="f-photo-note" class="line-input" type="text" placeholder="Alguna aclaración" value="'+escapeAttr(ui.photoNote)+'"></div>';
        html += '<button class="btn-primary" data-action="save-photo">Guardar foto</button>';
        html += '<button class="undo-link" data-action="pick-photo">Elegir otra foto</button>';
      } else {
        html += '<div class="photo-drop" data-action="pick-photo"><span class="icon">＋</span><p>Sacar foto del ticket o elegir del rollo</p></div>';
      }
      html += '<input type="file" id="f-photo-input" accept="image/*" capture="environment" style="display:none;">';
      html += '<p class="pending-note">En la versión que uso, la foto queda en cola y una IA la interpreta (monto, forma de pago, categoría y detalle) para sumarla al Panorama. En esta demo la foto no sale de tu navegador y queda en cola sin procesar.</p>';
      if(state.pendingPhotos.length>0){
        var n = state.pendingPhotos.length;
        html += '<span class="pending-badge">'+n+' foto'+(n>1?'s':'')+' en cola</span>';
      }
    }
    return html + '</div>';
  }

  function barRow(name, amount, total, max, color){
    var pct = total>0 ? Math.round(amount/total*100) : 0;
    var width = max>0 ? Math.max(4, Math.round(amount/max*100)) : 4;
    return '<div class="bar-row"><div class="bar-head"><span class="name">'+escapeHtml(name)+'</span><span class="amt">'+formatMoney(amount)+' · '+pct+'%</span></div><div class="bar-track"><div class="bar-fill" style="width:'+width+'%; background:'+color+'"></div></div></div>';
  }

  function renderPanorama(){
    var dash = computeDashboard();
    var html = '<div class="view">';
    html += '<div class="banner">Demo con gastos ficticios. Lo que cargues se guarda solo en este navegador.</div>';
    if(state.entries.length===0){
      return html + '<div class="empty-state"><span class="icon-mark">'+markSvg(40)+'</span><p>Todavía no hay gastos. Cargá el primero y acá vas a ver hacia dónde se va la plata.</p><button class="btn-primary" data-nav="cargar">Cargar el primero</button></div></div>';
    }
    html += '<h2 class="section-title">Panorama del mes</h2><div class="stat-grid">';
    html += '<div class="stat-tile wide"><p class="label">Gastado este mes</p><p class="value">'+formatMoney(dash.curTotal)+'</p>';
    if(dash.pctChange!==null) html += '<span class="delta '+(dash.pctChange>=0?'up':'down')+'">'+(dash.pctChange>=0?'▲':'▼')+' '+Math.round(Math.abs(dash.pctChange))+'% vs. mes anterior a esta altura</span>';
    html += '</div>';
    html += '<div class="stat-tile"><p class="label">Promedio diario</p><p class="value">'+formatMoney(dash.avgDaily)+'</p></div>';
    html += '<div class="stat-tile"><p class="label">Proyección a fin de mes</p><p class="value">'+formatMoney(dash.projected)+'</p></div></div>';

    var insights = buildInsights(dash);
    if(insights.length){
      html += '<h2 class="section-title">Insights automáticos</h2>';
      insights.forEach(function(ins){ html += '<div class="insight-card '+ins.level+'"><div><span class="tag">'+ins.tag+'</span><p>'+escapeHtml(ins.text)+'</p></div></div>'; });
    }

    if(dash.catEntries.length){
      html += '<h2 class="section-title">Dónde se concentra la plata</h2>';
      var shown = dash.catEntries.slice(0,6), rest = dash.catEntries.slice(6);
      var restTotal = rest.reduce(function(s,c){return s+c[1];},0);
      var maxAmt = Math.max(shown[0][1], restTotal);
      shown.forEach(function(c){ html += barRow(categoryLabel(c[0]), c[1], dash.curTotal, maxAmt, catColor(c[0])); });
      if(restTotal>0) html += barRow('Otros', restTotal, dash.curTotal, maxAmt, 'var(--cat-other)');
    }

    html += '<h2 class="section-title">Tendencia (últimos 6 meses)</h2>';
    var maxTrend = Math.max.apply(null, dash.trend.map(function(t){return t.total;}).concat([1]));
    html += '<div class="trend-chart">';
    dash.trend.forEach(function(t){
      var h = Math.max(3, Math.round(t.total/maxTrend*100));
      html += '<div class="trend-col" title="'+escapeAttr(formatMoney(t.total))+'"><div class="trend-bar-wrap"><div class="trend-bar'+(t.isCurrent?' current':'')+'" style="height:'+h+'%"></div></div><span class="m-label">'+t.label+'</span></div>';
    });
    html += '</div>';

    if(dash.payEntries.length){
      html += '<h2 class="section-title">Forma de pago</h2>';
      dash.payEntries.forEach(function(p){ html += barRow(p[0], p[1], dash.curTotal, dash.payEntries[0][1], payColor(p[0])); });
    }

    html += '<button class="undo-link" data-action="undo-last">Deshacer último gasto cargado</button>';
    html += '<button class="undo-link" data-action="export-data">Exportar datos (JSON)</button>';
    html += '<button class="undo-link" data-action="reset-demo">Restablecer demo</button>';
    return html + '</div>';
  }

  function renderRoot(){
    var root = document.getElementById('root');
    var scroller = root.querySelector('.view'); var top = scroller ? scroller.scrollTop : 0;
    root.innerHTML = renderTopbar() + (ui.view==='cargar' ? renderCargar() : renderPanorama()) + renderNav() + (ui.toast ? '<div class="toast" role="status">'+escapeHtml(ui.toast)+'</div>' : '');
    var v = root.querySelector('.view'); if(v) v.scrollTop = top;
  }

  function onRootClick(e){
    var t = e.target, el;
    if((el = t.closest('[data-nav]'))){ syncUiFromDom(); ui.view=el.getAttribute('data-nav'); renderRoot(); var v=document.querySelector('.view'); if(v) v.scrollTop=0; return; }
    if((el = t.closest('[data-mode]'))){ syncUiFromDom(); ui.formMode=el.getAttribute('data-mode'); renderRoot(); return; }
    if((el = t.closest('[data-pay]'))){ syncUiFromDom(); ui.payment=el.getAttribute('data-pay'); ui.errors.payment=false; renderRoot(); return; }
    if((el = t.closest('[data-cat]'))){ syncUiFromDom(); ui.category=el.getAttribute('data-cat'); ui.description=''; ui.descMode='chip'; ui.errors.category=false; renderRoot(); return; }
    if((el = t.closest('[data-desc]'))){ syncUiFromDom(); var dv=el.getAttribute('data-desc'); if(dv==='__custom__'){ ui.descMode='custom'; ui.description=''; } else { ui.descMode='chip'; ui.description=(ui.description===dv)?'':dv; } renderRoot(); return; }
    if(t.closest('[data-action="save-manual"]')){ handleSaveManual(); return; }
    if(t.closest('[data-action="pick-photo"]')){ var inp=document.getElementById('f-photo-input'); if(inp) inp.click(); return; }
    if(t.closest('[data-action="save-photo"]')){ handleSavePhoto(); return; }
    if(t.closest('[data-action="undo-last"]')){ handleUndo(); return; }
    if(t.closest('[data-action="export-data"]')){ handleExport(); return; }
    if(t.closest('[data-action="reset-demo"]')){ handleReset(); return; }
  }
  function onRootChange(e){
    if(e.target && e.target.id==='f-photo-input'){
      var file = e.target.files && e.target.files[0]; if(!file) return;
      syncUiFromDom();
      fileToCompressedDataUri(file).then(function(uri){ ui.photoPreview=uri; renderRoot(); }).catch(function(err){ console.error(err); });
    }
  }
  var rootEl = document.getElementById('root');
  rootEl.addEventListener('click', onRootClick);
  rootEl.addEventListener('change', onRootChange);
  renderRoot();
})();
</script>
</body>
</html>
